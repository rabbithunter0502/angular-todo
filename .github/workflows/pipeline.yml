name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node version lấy từ `.nvmrc` (một nguồn duy nhất, dùng chung với máy dev). Ràng buộc thật nằm
# ở `engines` trong package.json và ở ADR 0003 — đọc trước khi đổi.

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Bắt permalink/pin đã cũ trong docs — thứ không có gì compile nên mục ra trong im lặng.
      # Không fail khi docs pin tụt sau package.json (đó là chuyện cố ý, xem ADR 0007), chỉ fail
      # khi docs mâu thuẫn với chính docs/pinned-source.json.
      - run: npm run check:docs

  unit-test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: browser-dist
          path: dist/angular-todo/browser
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Downloads its own browser build here — separate from the pre-installed one this repo was
      # developed against locally, but a fresh `install` is exactly what a real runner does.
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: browser-dist
          path: dist/angular-todo/browser
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes to GitHub Pages — but only when BOTH are true:
  #   1. this is a push to `main` (not a PR preview, not workflow_dispatch on a branch), and
  #   2. the repository variable `DEPLOY_PAGES` is literally the string "true".
  #
  # (2) is the on/off switch: Settings → Secrets and variables → Actions → Variables tab →
  # New repository variable → name `DEPLOY_PAGES`, value `true`/`false`. It's unset by default,
  # so deploys are OFF until someone opts in. Flipping it back to `false` only stops *future*
  # deploys from this workflow — it does not take an already-published Pages site offline. To
  # fully unpublish, go to Settings → Pages → Build and deployment → Source → set to "None".
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Rebuilt rather than reusing the `build` job's artifact: that one is intentionally
      # base-href "/" (served at the root for `e2e`); GitHub Pages serves this repo from
      # https://<user>.github.io/angular-todo/, so assets need base-href "/angular-todo/".
      - run: npm run build -- --base-href /angular-todo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-todo/browser
      - id: deployment
        uses: actions/deploy-pages@v4
